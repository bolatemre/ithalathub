workflows:
  default-workflow:
    name: IthalatHub Live Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Sürümü en kararlı ve sorunsuz çalışan 3.22.2 sürümüne sabitliyoruz
      flutter: 3.22.2
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Android Project
        script: |
          rm -rf android
          flutter create --platforms=android .
      - name: Clean and Get Packages
        script: |
          flutter pub clean
          flutter pub get
      - name: Build Android APK (Release)
        script: |
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
