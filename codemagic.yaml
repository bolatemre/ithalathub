workflows:
  android-workflow:
    name: IthalatHub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Android Project
        script: |
          rm -rf android
          flutter create --platforms=android --org com.ithalathub .
      - name: Inject Internet Permission
        script: |
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="İthalatHub"
                  android:name="\${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Generate App Launcher Icons
        script: |
          flutter pub add flutter_launcher_icons --dev
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "logo.png"
          EOF
          flutter pub run flutter_launcher_icons:main
      - name: Build Android APK
        script: |
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-workflow:
    name: IthalatHub iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Recreate iOS Project
        script: |
          rm -rf ios
          flutter create --platforms=ios --org com.ithalathub .
      - name: Set iOS Bundle ID and Permissions
        script: |
          # iOS için internet ve WebView izinlerini Info.plist dosyasına işliyoruz
          PLIST="ios/Runner/Info.plist"
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}' "$PLIST"
          plutil -replace io.flutter.embedded_views_preview -bool YES "$PLIST"
      - name: Install Pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA (Unsigned)
        script: |
          # Henüz Apple Developer hesabın olmadığı için 'imzasız' build alıyoruz
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
