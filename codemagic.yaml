workflows:
  android-workflow:
    name: IthalatHub Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Android Project
        script: |
          rm -rf android
          flutter create --platforms=android --org com.ithalathub .
      - name: Inject Internet Permission
        script: |
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="İthalatHub"
                  android:name="\${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Generate App Launcher Icons
        script: |
          flutter pub add flutter_launcher_icons --dev
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "logo.png"
          EOF
          flutter pub run flutter_launcher_icons:main
      - name: Build Android APK
        script: |
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-workflow:
    name: IthalatHub iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ithalathub_key
    environment:
      flutter: 3.22.2
      xcode: latest
      cocoapods: default
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    scripts:
      - name: Recreate iOS Project
        script: |
          # Proje ismini tamamen küçük harfe (ithalathubapp) çekerek Dart hatasını çözdük
          rm -rf ios
          flutter create --platforms=ios --org com.ithalathub --project-name ithalathubapp .
      - name: Set iOS Bundle ID and Permissions
        script: |
          PLIST="ios/Runner/Info.plist"
          cat <<EOF > $PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>\$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleDisplayName</key>
              <string>İthalatHub</string>
              <key>CFBundleExecutable</key>
              <string>\$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>\$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>ithalathubapp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>\$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>\$(FLUTTER_BUILD_NUMBER)</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIMainStoryboardFile</key>
              <string>Main</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
              <key>CADisableMinimumFrameDurationOnPhone</key>
              <true/>
              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>
              <key>io.flutter.embedded_views_preview</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF
      - name: Set up Apple Certificates
        script: |
          # Apple Developer Portal'da senin açtığın gerçek Bundle ID'yi buraya yazdık
          app-store-connect fetch-signing-files "com.ithalathub.ithalathubApp" --create
          xcode-project use-profiles
      - name: Install Pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
